[project]
name = "poetry91"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexander",email = "you@example.com"}
]
requires-python = "^3.14"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
exclude = "venv"
mypy_path = "src"
explicit_package_bases = true

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119